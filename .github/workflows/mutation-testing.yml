name: Mutation Testing (Stryker)

# ─── Purpose ─────────────────────────────────────────────────────────────────
# Runs Stryker.NET mutation testing against the EricksonLopez.Result core package.
# Mutation testing operates as an asynchronous deferred quality gate on `main`
# (and manual/scheduled runs), preventing heavy 60+ minute runs from blocking PRs.
#
# Thresholds (Single Source of Truth in stryker-config.json):
#   • high  (≥100%) — ✅ HIGH (target quality score)
#   • low   (≥ 98%) — 🟡 LOW (acceptable, investigate minor regressions)
#   • break (< 95%) — ❌ FAILED (hard quality gate: non-zero exit code)
# ─────────────────────────────────────────────────────────────────────────────

on:
  workflow_dispatch:
    inputs:
      mutation-level:
        description: "Stryker mutation level (Basic, Standard, Advanced)"
        required: false
        default: "Standard"
        type: choice
        options:
          - Basic
          - Standard
          - Advanced
  # Run daily at 04:00 UTC (asynchronous deferred quality gate)
  schedule:
    - cron: "0 4 * * *"

concurrency:
  group: mutation-testing-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  statuses: write
  actions: read

env:
  DOTNET_NOLOGO: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  mutation-test:
    name: Stryker Mutation Testing
    runs-on: ubuntu-latest
    # Full Stryker runs on the core package evaluate thousands of mutants and may take
    # 60 to 90+ minutes depending on runner load. A 240-minute timeout avoids premature
    # artificial cancellations of legitimate runs while preventing indefinite hangs.
    timeout-minutes: 480

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore Strong Name key
        env:
          SNK_KEY: ${{ secrets.SNK_KEY }}
        run: |
          if [ -n "$SNK_KEY" ]; then
            echo "$SNK_KEY" | tr -d '\n\r ' | base64 --decode > EricksonLopez.Result.snk
          fi

      - name: Restore dependencies
        run: dotnet restore EricksonLopez.Result.slnx

      - name: Build (Release)
        run: dotnet build EricksonLopez.Result.slnx --no-restore --configuration Release

      - name: Install Stryker
        run: dotnet tool install --global dotnet-stryker

      # Stryker reads thresholds directly from stryker-config.json.
      # When the mutation score drops below 'break' (95%), Stryker exits with code 1.
      # We capture the exit code so that artifacts, reporting, and commit status can
      # execute before terminating the workflow.
      - name: Run Stryker (Core package)
        id: stryker
        run: |
          set +e
          dotnet stryker \
            --project EricksonLopez.Result.csproj \
            --test-project tests/EricksonLopez.Result.Tests/EricksonLopez.Result.Tests.csproj \
            --config-file stryker-config.json \
            --mutation-level ${{ inputs.mutation-level || 'Standard' }} \
            --reporter html \
            --reporter json \
            --reporter progress \
            --output StrykerOutput/ci
          STRYKER_EXIT_CODE=$?
          echo "exit_code=$STRYKER_EXIT_CODE" >> $GITHUB_OUTPUT
          echo "Stryker finished with exit code: $STRYKER_EXIT_CODE"
          exit 0

      - name: Upload Stryker report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stryker-report-${{ github.run_id }}
          path: StrykerOutput/ci/
          retention-days: 30

      # ─── Extract and display mutation score ───────────────────────────────
      # Parses the Stryker JSON report, dynamically reading thresholds from
      # stryker-config.json as the single source of truth, and outputs structured metadata.
      - name: Extract and report mutation score
        id: report
        if: always()
        run: python3 scripts/extract-mutation-score.py

      # ─── Post GitHub Commit Status ──────────────────────────────────────────
      # Persists the mutation score as an immutable commit status on the evaluated commit.
      # This allows publish.yml to query the quality gate status instantly on release.
      - name: Publish Commit Status
        if: always() && steps.report.outputs.score != ''
        uses: actions/github-script@v7
        env:
          SCORE: ${{ steps.report.outputs.score }}
          PASSED_GATE: ${{ steps.report.outputs.passed_gate }}
          STATUS: ${{ steps.report.outputs.status }}
          KILLED: ${{ steps.report.outputs.killed }}
          TOTAL: ${{ steps.report.outputs.total }}
        with:
          script: |
            const serverUrl = process.env.GITHUB_SERVER_URL || 'https://github.com';
            const sha = context.sha;
            const score = process.env.SCORE;
            const passed = process.env.PASSED_GATE === 'true';
            const statusLabel = process.env.STATUS;
            const killed = process.env.KILLED;
            const total = process.env.TOTAL;

            const state = passed ? 'success' : 'failure';
            const description = `Stryker: ${score}% (${killed}/${total} killed) - ${statusLabel}`;
            const targetUrl = `${serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;

            try {
              await github.rest.repos.createCommitStatus({
                owner: context.repo.owner,
                repo: context.repo.repo,
                sha: sha,
                state: state,
                context: 'mutation-testing/stryker',
                description: description.substring(0, 140),
                target_url: targetUrl
              });
              console.log(`Commit status successfully published as '${state}' on ${sha}`);
            } catch (err) {
              console.warn(`Could not set commit status: ${err.message}`);
            }

      # ─── Enforce Stryker Quality Gate ───────────────────────────────────────
      # Preserves Stryker exit code / quality gate failure.
      - name: Enforce Stryker Quality Gate
        if: always()
        run: |
          STRYKER_CODE="${{ steps.stryker.outputs.exit_code }}"
          PASSED_GATE="${{ steps.report.outputs.passed_gate }}"

          if [ "$STRYKER_CODE" != "0" ] || [ "$PASSED_GATE" != "true" ]; then
            echo "❌ Stryker mutation testing quality gate failed (Exit code: $STRYKER_CODE, Passed Gate: $PASSED_GATE)."
            exit 1
          fi
          echo "✅ Stryker mutation testing quality gate passed successfully."
